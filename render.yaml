services:
  - type: web
    name: roblox-mcp-mobile
    env: node
    buildCommand: npm install --ignore-scripts && npx tsc && node scripts/copy-assets.mjs 2>/dev/null || true
    startCommand: node dist/index.js --http
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 16384
      # Set MCP_AUTH_TOKEN to a random string for security
      # Generate one: openssl rand -hex 16
      - key: MCP_AUTH_TOKEN
        sync: false
    healthCheckPath: /
