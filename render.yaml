services:
  - type: web
    name: roblox-mcp-mobile
    env: node
    buildCommand: npm install --ignore-scripts && npx tsc && node scripts/copy-assets.mjs
    startCommand: node dist/index.js --http
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 16384
      # Set MCP_AUTH_TOKEN to a random string for security
      # Generate one: openssl rand -hex 16
      - key: MCP_AUTH_TOKEN
        sync: false
      # Optional: VoidHub RPC (Discord Rich Presence). See docs/setup-ios-cloud.md
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: DISCORD_CLIENT_SECRET
        sync: false
      - key: DISCORD_REDIRECT_URI
        sync: false
      - key: TOKEN_ENCRYPTION_KEY
        sync: false
      - key: DISCORD_BUTTON_URL
        sync: false
    healthCheckPath: /
